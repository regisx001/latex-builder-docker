[project]
name = "latex-sandbox"
version = "0.1.0"
description = "Isolated XeLaTeX compilation sandbox"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latex_sandbox"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: mark test as requiring real Docker image",
]

